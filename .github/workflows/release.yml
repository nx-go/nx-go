name: Release

on:
  workflow_dispatch:
    inputs:
      beta:
        description: 'Whether to publish a beta release'
        required: false
        default: false
        type: boolean
      dryRun:
        description: 'Whether to perform a dry run of the release process'
        required: false
        default: false
        type: boolean
      releaseAs:
        description: 'The version to release as (patch, minor, major)'
        required: false
        default: ''
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: ⚙ Setup
        uses: ./.github/actions/setup
        with:
          use_cache: false

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 🏷 Version
        shell: bash
        run: |
          target="nx-go:version"
          if [[ "$BETA" == "true" ]]; then
            target="nx-go:version:beta"
          fi

          args=(--dry-run="$DRY_RUN")
          if [[ -n "$RELEASE_AS" ]]; then
            args+=(--releaseAs="$RELEASE_AS")
          fi

          pnpm nx run "$target" "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          BETA: ${{ inputs.beta }}
          DRY_RUN: ${{ inputs.dryRun }}
          RELEASE_AS: ${{ inputs.releaseAs }}
