name: Release

on:
  workflow_dispatch:
    inputs:
      beta:
        description: 'Whether to publish a beta release'
        required: false
        default: false
        type: boolean
      dryRun:
        description: 'Whether to perform a dry run of the release process'
        required: false
        default: false
        type: boolean
      releaseAs:
        description: 'The version to release as (patch, minor, major)'
        required: false
        default: ''
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: ⚙ Setup
        uses: ./.github/actions/setup
        with:
          use_cache: false

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 🏷 Create release
        id: create-release
        shell: bash
        run: |
          current_version=$(node -p "require('./packages/nx-go/package.json').version")
          args=(--skip-publish)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "$BETA" == "true" ]]; then
            args+=(--specifier="${RELEASE_AS:-prerelease}" --preid=beta)
          elif [[ -n "$RELEASE_AS" ]]; then
            args+=(--specifier="$RELEASE_AS")
          fi

          pnpm nx release "${args[@]}"
          new_version=$(node -p "require('./packages/nx-go/package.json').version")
          if [[ "$current_version" != "$new_version" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          BETA: ${{ inputs.beta }}
          DRY_RUN: ${{ inputs.dryRun }}
          RELEASE_AS: ${{ inputs.releaseAs }}

      - name: 🏗 Build package
        if: ${{ !inputs.dryRun && steps.create-release.outputs.changed == 'true' }}
        run: pnpm nx build nx-go

      - name: 📦 Publish package
        if: ${{ !inputs.dryRun && steps.create-release.outputs.changed == 'true' }}
        shell: bash
        run: |
          args=()
          if [[ "$BETA" == "true" ]]; then
            args+=(--tag=beta)
          fi

          pnpm nx release publish "${args[@]}"
        env:
          BETA: ${{ inputs.beta }}
          NPM_CONFIG_PROVENANCE: true
