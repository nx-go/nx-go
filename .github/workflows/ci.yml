name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        nx_version: [23.3.1]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙ Setup
        uses: ./.github/actions/setup

      - name: 🎭 End-to-end tests
        run: pnpm nx affected --target=e2e --parallel
        env:
          NX_VERSION: ${{ matrix.nx_version }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙ Setup
        uses: ./.github/actions/setup

      - name: 💭 Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: pnpm commitlint --from HEAD~1 --to HEAD --verbose

      - name: 💭 Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: 🎈 Lint, test and build
        run: |
          pnpm nx affected --target=lint --parallel=3
          pnpm nx run-many --all --target=test --parallel=3 --ci --coverage --coverageReporters=lcov
          pnpm nx affected --target=build --parallel=3
        env:
          # Disable color in CI logs to improve GitHub integration
          FORCE_COLOR: false

      - name: ⛳ SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
