name: setup
description: Setup Node, Go and install dependencies

inputs:
  node_version:
    description: Node Version
    required: false
    default: 24.x
  go_version:
    description: Go Version
    required: false
    default: 1.26.3
  use_cache:
    description: Whether to use cache
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Derive appropriate SHAs for base and head for `nx affected` commands
      uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

    - name: Use Go ${{ inputs.go_version }}
      uses: actions/setup-go@v6
      with:
        cache: false # we do not install Go modules, so we do not need to cache them
        go-version: ${{ inputs.go_version }}

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js ${{ inputs.node_version }} with cache
      uses: actions/setup-node@v7
      if: ${{ inputs.use_cache == 'true' }}
      with:
        node-version: ${{ inputs.node_version }}
        registry-url: https://registry.npmjs.org
        cache: pnpm

    - name: Use Node.js ${{ inputs.node_version }}
      uses: actions/setup-node@v7
      if: ${{ inputs.use_cache != 'true' }}
      with:
        node-version: ${{ inputs.node_version }}
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --strict-peer-dependencies
